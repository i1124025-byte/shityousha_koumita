name: TMP test polls
on:
  push:
    branches: [claude/hopeful-wozniak-zdj4g2]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: pip install -q -r requirements-comments.txt
      - name: first comment text
        timeout-minutes: 3
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b=p.chromium.launch(channel="chrome"); pg=b.new_page(locale="ja-JP")
              pg.goto("https://news.yahoo.co.jp/polls/74560/comments?order=recommended",wait_until="domcontentloaded")
              pg.wait_for_selector('button[data-cl-params*="_cl_vmodule:cmt_usr;_cl_link:agbtn1;"]')
              print(pg.evaluate("[...document.querySelectorAll('article')].filter(a=>a.querySelector('button[data-cl-params*=\"cmt_usr;_cl_link:agbtn1;\"]')).slice(0,2).map(a=>a.innerText).join('\\n-----\\n')"))
              print(pg.evaluate("(()=>{const a=[...document.querySelectorAll('article')].find(a=>a.querySelector('button[data-cl-params*=\"cmt_usr;_cl_link:agbtn1;\"]'));return a.outerHTML.replace(/<svg.*?<\\/svg>/gs,'').slice(0,3000)})()"))
              b.close()
          PY
      - name: run script
        timeout-minutes: 25
        run: |
          start=$(date +%s)
          python yahoo_polls_comments_to_csv.py https://news.yahoo.co.jp/polls/74560 -o out.csv | grep -v '取得中' | tail -40
          echo "elapsed=$(( $(date +%s) - start ))s"
          python - <<'PY'
          import csv,collections
          rows=list(csv.DictReader(open('out.csv',encoding='utf-8-sig')))
          c=collections.Counter(r['type'] for r in rows); print('rows',len(rows),dict(c))
          for r in rows[:4]: print({k:(v[:50] if isinstance(v,str) else v) for k,v in r.items()})
          print('empty text:',sum(1 for r in rows if not r['text'].strip()))
          PY
