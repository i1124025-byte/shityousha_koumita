name: TMP probe summary
on:
  push:
    branches: [claude/hopeful-wozniak-zdj4g2]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sSL -A "$UA" https://news.yahoo.co.jp/ranking/comment | grep -o 'https://news.yahoo.co.jp/articles/[0-9a-f]*' | awk '!s[$0]++' | sed -n '1p;20p;40p' > arts.txt
          for A in $(cat arts.txt); do
            echo "=========== $A"
            for path in "/comments?page=1&order=recommended" ""; do
              curl -sSL -A "$UA" -o c.html "$A$path"
              python3 - "$path" <<'PY'
          import re,json,sys
          h=open('c.html',encoding='utf-8').read()
          m=re.search(r'__PRELOADED_STATE__\s*=\s*(\{.*?\})\s*</script>',h,re.S)
          s=json.loads(m.group(1))
          print('--- path', repr(sys.argv[1]))
          for k in s:
              if re.search('summar|ai|digest',k,re.I): print(k, json.dumps(s[k],ensure_ascii=False)[:1500])
          i=h.find('AI')
          for mm in list(re.finditer('要約',h))[:2]: print('CTX', re.sub(r'<[^>]+>',' ',h[mm.start()-200:mm.start()+600]).replace('\n',' '))
          PY
            done
          done
