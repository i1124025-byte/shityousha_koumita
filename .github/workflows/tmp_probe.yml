name: TMP probe comments
on:
  push:
    branches: [claude/hopeful-wozniak-zdj4g2]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          A=$(curl -sSL -A "$UA" https://news.yahoo.co.jp/ranking/comment | grep -o 'https://news.yahoo.co.jp/articles/[0-9a-f]*' | head -1)
          echo "ARTICLE=$A"
          for q in "" "?order=recommended" ; do
            /usr/bin/time -f "time=%es" curl -sSL -A "$UA" -o c.html -w "HTTP %{http_code} size=%{size_download}\n" "$A/comments$q"
            echo "agbtn1 count: $(grep -o '_cl_vmodule:cmt_usr;_cl_link:agbtn1;' c.html | wc -l)"
            echo "article tags: $(grep -o '<article' c.html | wc -l)"
            grep -o '__PRELOADED_STATE__' c.html | head -1
            python3 - <<'PY'
          import re,json
          h=open('c.html',encoding='utf-8').read()
          m=re.search(r'__PRELOADED_STATE__\s*=\s*(\{.*?\})\s*</script>',h,re.S)
          if m:
              s=json.loads(m.group(1)); print('KEYS',list(s.keys()))
              def walk(o,p=''):
                  if isinstance(o,dict):
                      for k,v in o.items(): walk(v,p+'.'+k)
                  elif isinstance(o,list) and o:
                      print('LIST',p,len(o),json.dumps(o[0],ensure_ascii=False)[:500])
              walk(s)
          i=h.find('cmt_usr;_cl_link:agbtn1')
          if i>0:
              a=h.rfind('<article',0,i); print('ARTICLE_HTML', re.sub(r'<svg.*?</svg>','',h[a:i+300])[:2500])
          PY
          done
