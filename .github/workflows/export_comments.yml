name: Export Yahoo News Comments

on:
  workflow_dispatch:
    inputs:
      article_url:
        description: 'Yahoo!ニュースの記事URL'
        required: true
        type: string

jobs:
  export-comments:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要なライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-comments.txt
          playwright install --with-deps chromium

      - name: コメントをCSV出力
        env:
          ARTICLE_URL: ${{ inputs.article_url }}
        run: |
          python yahoo_comments_to_csv.py "$ARTICLE_URL" -o comments.csv

      - name: CSVをアーティファクトとして保存
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-comments
          path: comments.csv
