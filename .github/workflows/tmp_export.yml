name: TMP export polls 74560
on:
  push:
    branches: [claude/hopeful-wozniak-zdj4g2]
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: pip install -q -r requirements-comments.txt
      - run: python yahoo_polls_comments_to_csv.py https://news.yahoo.co.jp/polls/74560 -o polls_comments_74560.csv
      - uses: actions/upload-artifact@v4
        with:
          name: yahoo-polls-comments-74560
          path: polls_comments_74560.csv
