name: TMP investigate ranking
on:
  push:
    branches: [claude/hopeful-wozniak-zdj4g2]
jobs:
  inv:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sSL -A "$UA" -o p.html https://news.yahoo.co.jp/ranking/comment
          python3 - <<'PY'
          import re, json
          h=open('p.html',encoding='utf-8').read()
          m=re.search(r'__PRELOADED_STATE__\s*=\s*(\{.*?\})\s*</script>',h,re.S)
          s=json.loads(m.group(1))
          def walk(o,p=''):
              if isinstance(o,dict):
                  for k,v in o.items(): walk(v,p+'.'+k)
              elif isinstance(o,list):
                  print('LIST',p,len(o), (json.dumps(o[0],ensure_ascii=False)[:600] if o else ''))
                  for i,v in enumerate(o[:1]): walk(v,p+'[0]')
          print('TOPKEYS',list(s.keys()))
          walk(s)
          for k in ['もっと見る','次へ','page=','50位','41']:
              for mm in list(re.finditer(re.escape(k),h))[:3]: print('CTX',k,':',re.sub(r'<svg.*?</svg>','',h[max(0,mm.start()-400):mm.start()+300]).replace('\n',' '))
          print('TAIL list html:', h[h.rfind('_cl_position:40;'):h.rfind('_cl_position:40;')+4000][-1800:])
          PY
          for p in "?page=2" "/2" "?p=2"; do curl -sSL -A "$UA" "https://news.yahoo.co.jp/ranking/comment$p" -o q.html -w "$p %{http_code} %{size_download}\n"; grep -o '_cl_position:[0-9]*;' q.html | head -1; grep -o '_cl_position:[0-9]*;' q.html | tail -1; done
