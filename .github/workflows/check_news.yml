name: Check Yahoo News Ranking

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check-ranking:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 前回のTOP10データをキャッシュから復元/保存
        uses: actions/cache@v3
        with:
          path: previous_top10.json
          key: yahoo-news-top10-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            yahoo-news-top10-cache-${{ runner.os }}-

      - name: 必要なライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: スクリプトの実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py
