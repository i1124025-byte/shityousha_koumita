name: Check Yahoo News Ranking

on:
  schedule:
    # 30分ごとに自動実行 (UTC表記のため注意)
    - cron: '*/30 * * * *'
  workflow_dispatch: # 手動で即時実行するボタンも追加

jobs:
  check-ranking:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v3

      - name: Python環境のセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 必要なライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: スクリプトの実行
        run: |
          python getYahooRankingEntertainment.py
