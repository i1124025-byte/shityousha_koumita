name: Export Yahoo Polls Comments

on:
  workflow_dispatch:
    inputs:
      polls_url:
        description: 'みんなの意見のURL（例: https://news.yahoo.co.jp/polls/74560）'
        required: true
        type: string

jobs:
  export-polls-comments:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ブラウザはランナーにインストール済みの Google Chrome を使う
      - name: 必要なライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-comments.txt

      - name: コメントをCSV出力
        env:
          POLLS_URL: ${{ inputs.polls_url }}
        run: |
          python yahoo_polls_comments_to_csv.py "$POLLS_URL" -o polls_comments.csv

      - name: CSVをアーティファクトとして保存
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-polls-comments
          path: polls_comments.csv
